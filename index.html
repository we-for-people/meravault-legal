<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeraVault</title><style>
:root{--paper:#F6F0E1;--ink:#26243A;--indigo:#3F37C9;--muted:#4A4760;--rule:#3F37C9;--card:#FFFDF7}
@media (prefers-color-scheme:dark){:root{--paper:#201E2E;--ink:#F1ECDF;--indigo:#A69CFF;--muted:#C9C3DA;--rule:#A69CFF;--card:#302D43}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Noto Sans","Noto Sans Devanagari",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
h1,h2,h3{font-family:"Roboto Slab",Georgia,serif;line-height:1.25}
h1{font-size:2rem;margin:.2em 0;text-align:center}
.rule{border:0;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);height:4px;margin:16px 0 24px}
nav{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:.95rem}
a{color:var(--indigo)}
section{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:8px 20px 16px;margin:24px 0;box-shadow:3px 3px 0 var(--ink)}
.updated{color:var(--muted);font-style:italic}
footer{color:var(--muted);text-align:center;font-size:.9rem}
</style></head>
<body><main><h1>MeraVault</h1><hr class="rule">
<p style="text-align:center">Your documents. Your phone. Nobody else.</p>
<nav><a href="privacy-policy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a></nav>
</main></body></html>
